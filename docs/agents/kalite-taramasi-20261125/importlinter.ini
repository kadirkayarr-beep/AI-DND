[importlinter]
root_packages =
    api
    game_parts
    adventure
    class_progression
    incidents
include_external_packages = False

[importlinter:contract:packages-not-api]
name = Engine packages do not import api (D-583)
type = forbidden
source_modules =
    game_parts
    adventure
    class_progression
    incidents
forbidden_modules =
    api

[importlinter:contract:routes-independent]
name = api.routes_* modules do not import each other
type = independence
modules =
    api.routes_catalog
    api.routes_economic
    api.routes_level_up
    api.routes_level_up_apply
    api.routes_quests
    api.routes_species
    api.routes_spells_read
    api.routes_spells_write
    api.routes_turn
    api.routes_undo
