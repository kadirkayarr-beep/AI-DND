        local_presence: {type: boolean}
    GameConversationNpc:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: ["string", "null"]}
    GameConversation:
      type: object
      additionalProperties: false
      required: [active, interlocutor]
      properties:
        active: {type: boolean}
