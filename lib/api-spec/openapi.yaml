        player_combat_status:
          type: string
          enum: [active, unconscious, dead]
        turn_index:
          type: integer
          minimum: 0
        quests:
          type: array
          items: {$ref: "#/components/schemas/QuestState"}
        quest_offers:
          type: array
          items: {$ref: "#/components/schemas/QuestOffer"}
        adventure:
          $ref: "#/components/schemas/AdventureProjection"
        campaign_adventures:
          $ref: "#/components/schemas/CampaignAdventureJournal"
        known_lore:
          type: array
          items: {$ref: "#/components/schemas/KnownLoreFact"}
        known_factions:
          type: array
          items: {$ref: "#/components/schemas/KnownFactionStanding"}
        scene_incidents:
          description: Optional player-safe annotation of noticed local incidents. Not a quest, objective, or reward preview.
          type: array
          items: {$ref: "#/components/schemas/SceneIncident"}
      required:
        - campaign_time
        - known_scheduled_events
