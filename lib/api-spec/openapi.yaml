openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Direct AI-DND game-session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/health:
    get:
      operationId: getGameHealth
      tags: [game]
      summary: Check the AI-DND service
      responses:
        "200":
          description: AI-DND service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameHealth"
  /game/sessions:
    post:
      operationId: createGameSession
      tags: [game]
      summary: Create a new isolated game session
      responses:
        "200":
          description: New game session and its public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /game/sessions/{session_id}/state:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
    get:
      operationId: getGameSessionState
      tags: [game]
      summary: Read the canonical public state for a game session
      responses:
        "200":
          description: Current public game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
  /game/sessions/{session_id}/turn:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
    post:
      operationId: playGameTurn
      tags: [game]
      summary: Submit one player message to the Python game engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameTurnInput"
      responses:
        "200":
          description: Engine-confirmed narration and updated public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTurnResult"
  /game/campaigns:
    get:
      operationId: getCampaigns
      tags: [game]
      summary: List safe campaign metadata
      responses:
        "200":
          description: Persistent campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
    post:
      operationId: createCampaign
      tags: [game]
      summary: Create a campaign with an initial server-owned save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreateInput"
      responses:
        "200":
          description: Campaign, live session, and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
  /game/campaigns/{campaign_id}:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaign
      tags: [game]
      summary: Read safe metadata, canonical UI state, and saved history
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDetail"
  /game/campaigns/{campaign_id}/resume:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeCampaign
      tags: [game]
      summary: Restore a campaign into a current runtime session
      responses:
        "200":
          description: Resumed campaign and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
  /game/campaigns/{campaign_id}/save:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: saveCampaign
      tags: [game]
      summary: Save the current server-side campaign session
      responses:
        "200":
          description: Updated safe campaign metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameHealth:
      type: object
      properties:
        status:
          type: string
        engine:
          type: string
        model:
          type: string
      required: [status, engine, model]
    GameSession:
      type: object
      properties:
        session_id:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
      required: [session_id, state]
    GameTurnInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
      required: [message]
    GameTurnResult:
      type: object
      properties:
        session_id:
          type: string
        narration:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
      required: [session_id, narration, state]
    GameState:
      type: object
      properties:
        location:
          type: string
        locations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GameLocation"
        character:
          $ref: "#/components/schemas/GameCharacter"
        inventory:
          type: array
          items:
            type: string
        npcs:
          type: array
          items:
            $ref: "#/components/schemas/GameNpc"
        features:
          type: array
          items:
            $ref: "#/components/schemas/GameFeature"
        doors:
          type: array
          items:
            $ref: "#/components/schemas/GameDoor"
        combat:
          $ref: "#/components/schemas/GameCombat"
        player_combat_status:
          type: ["string", "null"]
        turn_index:
          type: integer
      required:
        - location
        - locations
        - character
        - inventory
        - npcs
        - features
        - doors
        - combat
        - player_combat_status
        - turn_index
    GameLocation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
      required: [id, name, type, description]
    GameCharacter:
      type: object
      properties:
        name:
          type: string
        race:
          type: string
        class:
          type: string
        strength:
          type: integer
        dexterity:
          type: integer
        constitution:
          type: integer
        intelligence:
          type: integer
        wisdom:
          type: integer
        charisma:
          type: integer
        proficient_skills:
          type: array
          items:
            type: string
        level:
          type: integer
        proficiency_bonus:
          type: integer
        max_hp:
          type: integer
        current_hp:
          type: integer
        armor_class:
          type: integer
      required:
        - name
        - race
        - class
        - strength
        - dexterity
        - constitution
        - intelligence
        - wisdom
        - charisma
        - proficient_skills
        - level
        - proficiency_bonus
        - max_hp
        - current_hp
        - armor_class
    GameNpc:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        location:
          type: string
        appearance:
          type: ["string", "null"]
        relationship:
          type: ["string", "null"]
        max_hp:
          type: ["integer", "null"]
        current_hp:
          type: ["integer", "null"]
        armor_class:
          type: ["integer", "null"]
        combat_status:
          type: ["string", "null"]
      required:
        - id
        - name
        - role
        - location
        - appearance
        - relationship
        - max_hp
        - current_hp
        - armor_class
        - combat_status
    GameFeature:
      type: object
      properties:
        location:
          type: string
        name:
          type: string
        description:
          type: string
      required: [location, name, description]
    GameDoor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        description:
          type: string
        open:
          type: boolean
        locked:
          type: boolean
        broken:
          type: boolean
      required: [id, name, location, description, open, locked, broken]
    GameCombat:
      type: object
      properties:
        active:
          type: boolean
        round:
          type: integer
        initiative_order:
          type: array
          items:
            type: string
        current_turn_index:
          type: integer
        participants:
          type: array
          items:
            type: object
            additionalProperties: true
        target_id:
          type: ["string", "null"]
      additionalProperties: true
    CampaignCreateInput:
      type: object
      properties:
        name:
          type: ["string", "null"]
          minLength: 1
          maxLength: 100
      additionalProperties: false
    CampaignSummary:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_played_at:
          type: string
          format: date-time
        save_version:
          type: integer
        character_name:
          type: string
        character_race:
          type: string
        character_class:
          type: string
        character_level:
          type: integer
        location:
          type: string
      required:
        - campaign_id
        - name
        - created_at
        - updated_at
        - last_played_at
        - save_version
        - character_name
        - character_race
        - character_class
        - character_level
        - location
    CampaignHistoryEntry:
      type: object
      properties:
        player_message:
          type: string
        narration:
          type: string
        created_at:
          type: string
          format: date-time
      required: [player_message, narration, created_at]
    CampaignDetail:
      type: object
      properties:
        campaign:
          $ref: "#/components/schemas/CampaignSummary"
        state:
          $ref: "#/components/schemas/GameState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/CampaignHistoryEntry"
      required: [campaign, state, history]
    CampaignSession:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/CampaignHistoryEntry"
      required: [campaign_id, session_id, name, state, history]

