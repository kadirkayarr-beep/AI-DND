      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
        parent_location_id:
          anyOf:
            - type: string
            - type: "null"
        exit_location_id:
          anyOf:
            - type: string
            - type: "null"
