openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: >-
    AI-DND API contract. Prefer the /game/... route family for new clients.
    The matching /... paths are retained as legacy compatibility aliases.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Direct AI-DND game-session operations
paths:
  /game/health:
    get:
      operationId: getGameHealth
      tags: [game]
      summary: Check the AI-DND service
      responses:
        "200":
          description: AI-DND service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /game/sessions:
    post:
      operationId: createGameSession
      tags: [game]
      summary: Create a new isolated game session
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: New game session and its public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /game/sessions/{session_id}/state:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getGameSessionState
      tags: [game]
      summary: Read the canonical public state for a game session
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Current public game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
  /game/sessions/{session_id}/species-actions:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveSpeciesTraitAction
      tags: [game]
      summary: Resolve one server-authoritative species trait action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesTraitActionInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Server-rolled effect and updated canonical character state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesTraitCommandResult"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
  /sessions/{session_id}/species-actions:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resolveSpeciesTraitActionCompat
      tags: [game]
      summary: Legacy server-authoritative species action alias
      description: Compatibility alias for /game/sessions/{session_id}/species-actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesTraitActionInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Server-rolled effect and updated canonical character state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpeciesTraitCommandResult"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
  /game/sessions/{session_id}/turn:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: playGameTurn
      tags: [game]
      summary: Submit one player message to the Python game engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameTurnInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Engine-confirmed narration and updated public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTurnResult"
        "409":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /game/sessions/{session_id}/quests/{quest_id}/accept:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: quest_id
        required: true
        schema: {type: string, maxLength: 120}
    post:
      operationId: acceptGameQuest
      tags: [game]
      summary: Explicitly accept a server-owned quest offer
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Canonical quest state and transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuestCommandResult"}
        "404": {$ref: "#/components/responses/ApiError"}
        "500": {$ref: "#/components/responses/ApiError"}
        "503": {$ref: "#/components/responses/ApiError"}
  /game/sessions/{session_id}/quests/{quest_id}/cancel:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: quest_id
        required: true
        schema: {type: string, maxLength: 120}
    post:
      operationId: cancelGameQuest
      tags: [game]
      summary: Explicitly cancel an accepted quest
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Canonical quest state and transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuestCommandResult"}
        "404": {$ref: "#/components/responses/ApiError"}
        "500": {$ref: "#/components/responses/ApiError"}
        "503": {$ref: "#/components/responses/ApiError"}
  /game/sessions/{session_id}/ambient-events/{event_instance_id}/actions:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: event_instance_id
        required: true
        schema: {type: string, format: uuid, maxLength: 96}
    post:
      operationId: resolveAmbientEventAction
      tags: [game]
      summary: Resolve one validated action against an active ambient event
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AmbientEventActionInput"}
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Engine-confirmed event result and persisted campaign state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AmbientEventCommandResult"}
        "404": {$ref: "#/components/responses/ApiError"}
        "422": {$ref: "#/components/responses/RequestValidationError"}
        "500": {$ref: "#/components/responses/ApiError"}
  /sessions/{session_id}/quests/{quest_id}/accept:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: quest_id
        required: true
        schema: {type: string, maxLength: 120}
    post:
      operationId: acceptLegacyQuest
      tags: [game]
      summary: Legacy quest accept alias
      description: Compatibility alias for /game/sessions/{session_id}/quests/{quest_id}/accept.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Canonical quest state and transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuestCommandResult"}
        "404": {$ref: "#/components/responses/ApiError"}
        "500": {$ref: "#/components/responses/ApiError"}
        "503": {$ref: "#/components/responses/ApiError"}
  /sessions/{session_id}/quests/{quest_id}/cancel:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: quest_id
        required: true
        schema: {type: string, maxLength: 120}
    post:
      operationId: cancelLegacyQuest
      tags: [game]
      summary: Legacy quest cancel alias
      description: Compatibility alias for /game/sessions/{session_id}/quests/{quest_id}/cancel.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Canonical quest state and transition
          content:
            application/json:
              schema: {$ref: "#/components/schemas/QuestCommandResult"}
        "404": {$ref: "#/components/responses/ApiError"}
        "500": {$ref: "#/components/responses/ApiError"}
        "503": {$ref: "#/components/responses/ApiError"}
  /sessions/{session_id}/ambient-events/{event_instance_id}/actions:
    parameters:
      - in: path
        name: session_id
        required: true
        schema: {type: string, format: uuid}
      - in: path
        name: event_instance_id
        required: true
        schema: {type: string, format: uuid, maxLength: 96}
    post:
      operationId: resolveAmbientEventActionCompat
      tags: [game]
      summary: Legacy ambient event action alias
      description: Compatibility alias for /game/sessions/{session_id}/ambient-events/{event_instance_id}/actions.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AmbientEventActionInput"}
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Engine-confirmed event result and persisted campaign state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AmbientEventCommandResult"}
        "404": {$ref: "#/components/responses/ApiError"}
        "422": {$ref: "#/components/responses/RequestValidationError"}
        "500": {$ref: "#/components/responses/ApiError"}
  /game/logout:
    post:
      operationId: logoutGame
      tags: [game]
      summary: Clear the HttpOnly session cookie
      responses:
        "204":
          description: Session cookie cleared
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /logout:
    post:
      operationId: logoutLegacy
      tags: [game]
      summary: Legacy session cookie logout alias
      responses:
        "204":
          description: Session cookie cleared
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
  /game/campaign-start-options:
    get:
      operationId: getCampaignStartOptions
      tags: [game]
      summary: List campaign starts from installed verified setting packs
      responses:
        "200":
          description: Verified campaign start options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignStartOptionsResponse"
  /game/character-options:
    get:
      operationId: getCharacterOptions
      tags: [game]
      summary: Read race and class choices supported by the Python engine
      responses:
        "200":
          description: Canonical character creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreationOptions"
  /game/character-creation-catalog:
    get:
      operationId: getCharacterCreationCatalog
      tags: [game]
      summary: Read D&D 2024 rules character creation options catalog
      responses:
        "200":
          description: Canonical character creation catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreationCatalogResponse"
  /game/character-identity-suggestions:
    post:
      operationId: createCharacterIdentitySuggestion
      tags: [game]
      summary: Ask for one bounded character-identity draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySuggestionRequest"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: The same suggestion job for this request id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySuggestionJob"
        "422":
          $ref: "#/components/responses/RequestValidationError"
  /game/character-identity-suggestions/{request_id}:
    parameters:
      - in: path
        name: request_id
        required: true
        schema:
          type: string
          maxLength: 80
    get:
      operationId: getCharacterIdentitySuggestion
      tags: [game]
      summary: Read one character-identity suggestion job
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Current suggestion job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySuggestionJob"
        "404":
          $ref: "#/components/responses/ApiError"
  /game/campaigns:
    get:
      operationId: getCampaigns
      tags: [game]
      summary: List safe campaign metadata
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Persistent campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createCampaign
      tags: [game]
      summary: Create a campaign with an initial server-owned save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreateInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Campaign, live session, and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
        "422":
          $ref: "#/components/responses/CampaignCreateValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /game/campaigns/{campaign_id}:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteCampaign
      tags: [game]
      summary: Permanently delete a selected campaign and revoke its active session
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Campaign is absent after the atomic deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDeleteResult"
        "503":
          $ref: "#/components/responses/ApiError"
    get:
      operationId: getCampaign
      tags: [game]
      summary: Read safe metadata, canonical UI state, and saved history
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDetail"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /game/campaigns/{campaign_id}/resume:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeCampaign
      tags: [game]
      summary: Restore a campaign into a current runtime session
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Resumed campaign and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /game/campaigns/{campaign_id}/save:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: saveCampaign
      tags: [game]
      summary: Save the current server-side campaign session
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Updated safe campaign metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /health:
    get:
      operationId: getLegacyHealth
      tags: [game]
      summary: Legacy health alias
      description: Compatibility alias for /game/health. Prefer the /game route family for new clients.
      responses:
        "200":
          description: AI-DND service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /campaign-start-options:
    get:
      operationId: getLegacyCampaignStartOptions
      tags: [game]
      summary: Legacy campaign-start-options alias
      description: Compatibility alias for /game/campaign-start-options. Prefer the /game route family for new clients.
      responses:
        "200":
          description: Verified campaign start options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignStartOptionsResponse"
  /character-options:
    get:
      operationId: getLegacyCharacterOptions
      tags: [game]
      summary: Legacy character-options alias
      description: Compatibility alias for /game/character-options. Prefer the /game route family for new clients.
      responses:
        "200":
          description: Canonical character creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreationOptions"
  /character-creation-catalog:
    get:
      operationId: getLegacyCharacterCreationCatalog
      tags: [game]
      summary: Legacy character-creation-catalog alias
      description: Compatibility alias for /game/character-creation-catalog. Prefer the /game route family for new clients.
      responses:
        "200":
          description: Canonical character creation catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreationCatalogResponse"
  /character-identity-suggestions:
    post:
      operationId: createLegacyCharacterIdentitySuggestion
      tags: [game]
      summary: Legacy character-identity suggestion alias
      description: Compatibility alias for /game/character-identity-suggestions. Prefer the /game route family for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentitySuggestionRequest"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: The same suggestion job for this request id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySuggestionJob"
        "422":
          $ref: "#/components/responses/RequestValidationError"
  /character-identity-suggestions/{request_id}:
    parameters:
      - in: path
        name: request_id
        required: true
        schema:
          type: string
          maxLength: 80
    get:
      operationId: getLegacyCharacterIdentitySuggestion
      tags: [game]
      summary: Legacy character-identity suggestion status alias
      description: Compatibility alias for /game/character-identity-suggestions/{request_id}. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Current suggestion job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentitySuggestionJob"
        "404":
          $ref: "#/components/responses/ApiError"
  /sessions:
    post:
      operationId: createLegacySession
      tags: [game]
      summary: Legacy session-creation alias
      description: Compatibility alias for /game/sessions. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: New game session and its public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /sessions/{session_id}/state:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getLegacySessionState
      tags: [game]
      summary: Legacy session-state alias
      description: Compatibility alias for /game/sessions/{session_id}/state. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Current public game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
        "404":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
  /sessions/{session_id}/turn:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: playLegacyTurn
      tags: [game]
      summary: Legacy player-turn alias
      description: Compatibility alias for /game/sessions/{session_id}/turn. Prefer the /game route family for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameTurnInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Engine-confirmed narration and updated public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTurnResult"
        "404":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /campaigns:
    get:
      operationId: getLegacyCampaigns
      tags: [game]
      summary: Legacy campaign-list alias
      description: Compatibility alias for /game/campaigns. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Persistent campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createLegacyCampaign
      tags: [game]
      summary: Legacy campaign-creation alias
      description: Compatibility alias for /game/campaigns. Prefer the /game route family for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreateInput"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Campaign, live session, and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
        "422":
          $ref: "#/components/responses/CampaignCreateValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /campaigns/{campaign_id}:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: deleteLegacyCampaign
      tags: [game]
      summary: Legacy campaign-deletion alias
      description: Compatibility alias for /game/campaigns/{campaign_id}. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Campaign is absent after the atomic deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDeleteResult"
        "503":
          $ref: "#/components/responses/ApiError"
    get:
      operationId: getLegacyCampaign
      tags: [game]
      summary: Legacy campaign-detail alias
      description: Compatibility alias for /game/campaigns/{campaign_id}. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDetail"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /campaigns/{campaign_id}/resume:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeLegacyCampaign
      tags: [game]
      summary: Legacy campaign-resume alias
      description: Compatibility alias for /game/campaigns/{campaign_id}/resume. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Resumed campaign and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /campaigns/{campaign_id}/save:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: saveLegacyCampaign
      tags: [game]
      summary: Legacy campaign-save alias
      description: Compatibility alias for /game/campaigns/{campaign_id}/save. Prefer the /game route family for new clients.
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: Updated safe campaign metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/RequestValidationError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
components:
  schemas:
    CampaignDeleteResult:
      type: object
      required: [campaign_id, deleted]
      properties:
        campaign_id:
          type: string
        deleted:
          type: boolean
    IdentitySuggestionRequest:
      type: object
      additionalProperties: false
      required: [draft_id, field, request_id, input_revision]
      properties:
        draft_id:
          type: string
          minLength: 1
          maxLength: 80
        field:
          type: string
        request_id:
          type: string
          minLength: 1
          maxLength: 80
        input_revision:
          type: integer
          minimum: 0
          maximum: 100000
        current_text:
          type: string
          maxLength: 1000
          default: ""
        locked:
          type: boolean
          default: false
        name:
          type: string
          maxLength: 80
          nullable: true
        species:
          type: string
          maxLength: 40
          nullable: true
        character_class:
          type: string
          maxLength: 40
          nullable: true
        context_fields:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/IdentityContextField"
    IdentityContextField:
      type: object
      additionalProperties: false
      required: [field]
      properties:
        field:
          type: string
        text:
          type: string
          maxLength: 1000
          default: ""
        locked:
          type: boolean
          default: false
        allow_as_context:
          type: boolean
          default: false
    IdentitySuggestionJob:
      type: object
      additionalProperties: false
      required: [request_id, draft_id, field, input_revision, status]
      properties:
        request_id:
          type: string
        draft_id:
          type: string
        field:
          type: string
        input_revision:
          type: integer
        status:
          type: string
        suggestion:
          type: string
          nullable: true
        code:
          type: string
          nullable: true
    HealthResponse:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok]
          default: ok
        engine:
          type: string
          enum: [AI-DND]
          default: AI-DND
        model:
          type: string
          enum: [qwen3:8b]
          default: qwen3:8b
      required: [status, engine, model]
    GameSession:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/GameState"
      required: [session_id, state]
    GameTurnInput:
      type: object
      description: The message must contain at least one non-whitespace character.
      additionalProperties: false
      properties:
        combat_action:
          anyOf:
            - $ref: "#/components/schemas/CombatActionInput"
            - type: "null"
        combat_id:
          type: ["string", "null"]
          minLength: 1
          maxLength: 128
        combat_round:
          type: ["integer", "null"]
          minimum: 1
        combat_turn_index:
          type: ["integer", "null"]
          minimum: 0
        message:
          type: string
          minLength: 1
          maxLength: 4000
        interaction_mode:
          type: ["string", "null"]
          enum: [say, do, ask_dm, null]
        target_id:
          type: ["string", "null"]
          minLength: 1
          maxLength: 128
        action_id:
          type: ["string", "null"]
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
      required: [message]
    CombatActionInput:
      type: object
      additionalProperties: false
      properties:
        steps:
          type: array
          minItems: 1
          maxItems: 8
          items:
            $ref: "#/components/schemas/EconomyStepInput"
      required: [steps]
    EconomyStepInput:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum: [attack, continue_attack, move, dash, ready, react, decline_reaction, end_turn, species, disengage, dodge, help, hide, influence, magic, search, study, utilize]
        resource: {type: string, enum: [action, bonus], default: action}
        target_id: {type: ["string", "null"], minLength: 1, maxLength: 128}
        distance_ft: {type: ["integer", "null"], minimum: 1}
        opportunity_id: {type: ["string", "null"]}
        ability: {type: ["string", "null"]}
        form: {type: ["string", "null"]}
        trigger:
          anyOf:
            - $ref: "#/components/schemas/ReadyTriggerInput"
            - type: "null"
        response:
          anyOf:
            - $ref: "#/components/schemas/ReadyResponseInput"
            - type: "null"
      required: [kind]
    ReadyTriggerInput:
      type: object
      additionalProperties: false
      properties:
        event: {type: string, enum: [actor_moves, actor_attacks]}
        actor_id: {type: string, minLength: 1, maxLength: 128}
      required: [event, actor_id]
    ReadyResponseInput:
      type: object
      additionalProperties: false
      properties:
        kind: {type: string, enum: [attack, move]}
        target_id: {type: ["string", "null"]}
        distance_ft: {type: ["integer", "null"], minimum: 1}
      required: [kind]
    GameTurnResult:
      type: object
      properties:
        session_id:
          type: string
          format: uuid
        action_id:
          type: string
          format: uuid
        narration:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
        combat_result:
          anyOf:
            - $ref: "#/components/schemas/CombatTurnResult"
            - type: "null"
          description: Structured combat outcome returned by Python; null for non-combat turns.
        combat_history_entry:
          anyOf:
            - $ref: "#/components/schemas/CombatHistoryEntry"
            - type: "null"
          description: Stable server-owned ID and validated result for durable combat history.
        skill_check_result:
          anyOf:
            - $ref: "#/components/schemas/SkillCheckResult"
            - type: "null"
          description: Structured Python-owned skill-check result; null when no skill check occurred.
        quest_outcomes:
          type: array
          items: {$ref: "#/components/schemas/QuestOutcome"}
        level_up:
          anyOf:
            - $ref: "#/components/schemas/LevelUpResult"
            - type: "null"
          description: Server-owned experience award for this turn. Null when the turn granted no experience.
      required: [session_id, action_id, narration, state, combat_result, combat_history_entry, skill_check_result, quest_outcomes, level_up]
    LevelUpResult:
      type: object
      additionalProperties: false
      properties:
        previous_level:
          type: integer
          minimum: 1
          maximum: 4
        new_level:
          type: integer
          minimum: 1
          maximum: 4
        xp_gained:
          type: integer
          minimum: 1
        hit_points_gained:
          type: integer
          minimum: 0
      required: [previous_level, new_level, xp_gained, hit_points_gained]
    QuestObjective:
      type: object
      additionalProperties: false
      properties:
        objective_id: {type: string, maxLength: 120}
        description: {type: string, maxLength: 1000}
        status: {type: string, enum: [active, completed, cancelled]}
        progress: {type: integer, minimum: 0}
        required_count: {type: integer, minimum: 1, maximum: 1000}
      required: [objective_id, description, status, progress, required_count]
    QuestObjectiveOffer:
      type: object
      additionalProperties: false
      properties:
        objective_id: {type: string, maxLength: 120}
        description: {type: string, maxLength: 1000}
        kind: {type: string, enum: [visit_location, defeat_entity, acquire_item]}
        target: {type: string, maxLength: 160}
        required_count: {type: integer, minimum: 1, maximum: 1000}
      required: [objective_id, description, kind, target, required_count]
    QuestOffer:
      type: object
      additionalProperties: false
      properties:
        quest_id: {type: string, maxLength: 120}
        title: {type: string, maxLength: 160}
        description: {type: string, maxLength: 2000}
        giver_npc_id: {type: ["string", "null"], maxLength: 120}
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/QuestObjectiveOffer"
      required: [quest_id, title, description, giver_npc_id, objectives]
    QuestState:
      type: object
      additionalProperties: false
      properties:
        quest_id: {type: string, maxLength: 120}
        title: {type: string, maxLength: 160}
        description: {type: string, maxLength: 2000}
        status: {type: string, enum: [accepted, completed, cancelled]}
        giver_npc_id: {type: ["string", "null"], maxLength: 120}
        objectives:
          type: array
          items: {$ref: "#/components/schemas/QuestObjective"}
      required: [quest_id, title, description, status, giver_npc_id, objectives]
    QuestOutcome:
      type: object
      additionalProperties: false
      properties:
        event_id: {type: string, maxLength: 300}
        quest_id: {type: string, maxLength: 120}
        transition:
          type: string
          enum: [accepted, objective_progress, objective_completed, completed, cancelled]
        objective_id: {type: ["string", "null"], maxLength: 120}
        source_event_id: {type: string, maxLength: 300}
        turn_index: {type: integer, minimum: 0}
      required: [event_id, quest_id, transition, objective_id, source_event_id, turn_index]
    QuestCommandResult:
      type: object
      additionalProperties: false
      properties:
        session_id: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/GameState"}
        quest: {$ref: "#/components/schemas/QuestState"}
        outcome:
          anyOf:
            - $ref: "#/components/schemas/QuestOutcome"
            - type: "null"
      required: [session_id, state, quest, outcome]
    AmbientEventActionInput:
      type: object
      additionalProperties: false
      properties:
        action_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        action:
          type: string
          enum: [interact, observe]
      required: [action_id, action]
    AmbientEventResult:
      type: object
      additionalProperties: false
      properties:
        event_instance_id:
          type: string
          format: uuid
          maxLength: 96
        action_id:
          type: string
          format: uuid
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
        status:
          type: string
          enum: [APPLIED, REJECTED, NO_EFFECT, ALREADY_APPLIED]
        reason_code:
          type: ["string", "null"]
          maxLength: 64
        transition_id:
          type: ["string", "null"]
          maxLength: 160
        canonical_event_id:
          type: ["string", "null"]
          format: uuid
      required:
        - event_instance_id
        - action_id
        - status
        - reason_code
        - transition_id
        - canonical_event_id
    AmbientEventCommandResult:
      type: object
      additionalProperties: false
      properties:
        session_id: {type: string, format: uuid}
        state: {$ref: "#/components/schemas/GameState"}
        result: {$ref: "#/components/schemas/AmbientEventResult"}
      required: [session_id, state, result]
    SpeciesTraitActionInput:
      type: object
      additionalProperties: false
      properties:
        action_id:
          type: ["string", "null"]
          format: uuid
          description: UUIDv4 action receipt identity; reuse on network retry.
        action:
          type: string
          enum:
            - healing_hands
            - celestial_revelation
            - large_form
            - adrenaline_rush
            - cloud_jaunt
            - arm_giant_ancestry
            - choose_giant_ancestry
            - short_rest
            - long_rest
        form:
          type: ["string", "null"]
          enum: [heavenly_wings, inner_radiance, necrotic_shroud, null]
        ancestry:
          type: ["string", "null"]
          enum: [cloud, fire, frost, hill, stone, storm, null]
        armed:
          type: ["boolean", "null"]
      required: [action]
    SpeciesTraitActionResult:
      type: object
      additionalProperties: false
      properties:
        action: {type: string}
        message:
          type: string
          minLength: 1
          maxLength: 500
        effects:
          type: object
          additionalProperties: true
      required: [action, message, effects]
    SpeciesTraitCommandResult:
      type: object
      additionalProperties: false
      properties:
        session_id: {type: string, format: uuid}
        action_id: {type: ["string", "null"], format: uuid}
        state: {$ref: "#/components/schemas/GameState"}
        result: {$ref: "#/components/schemas/SpeciesTraitActionResult"}
      required: [session_id, state, result]
    SpeciesTraitState:
      type: object
      additionalProperties: false
      properties:
        healing_hands_uses_remaining: {type: integer, minimum: 0}
        celestial_revelation_uses_remaining: {type: integer, minimum: 0}
        active_celestial_form:
          type: ["string", "null"]
          enum: [heavenly_wings, inner_radiance, necrotic_shroud, null]
        celestial_revelation_turns_remaining: {type: integer, minimum: 0}
        celestial_damage_used_turn: {type: ["integer", "null"], minimum: 0}
        giant_ancestry_uses_remaining: {type: integer, minimum: 0}
        giant_ancestry_armed: {type: boolean}
        large_form_uses_remaining: {type: integer, minimum: 0}
        large_form_turns_remaining: {type: integer, minimum: 0}
        adrenaline_rush_uses_remaining: {type: integer, minimum: 0}
        relentless_endurance_available: {type: boolean}
        temporary_hit_points: {type: integer, minimum: 0}
        bonus_action_used_round: {type: ["integer", "null"], minimum: 1}
        movement_budget_ft: {type: integer, minimum: 0}
        movement_effect:
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        player_turn_counter: {type: integer, minimum: 0}
      required:
        - healing_hands_uses_remaining
        - celestial_revelation_uses_remaining
        - active_celestial_form
        - celestial_revelation_turns_remaining
        - celestial_damage_used_turn
        - giant_ancestry_uses_remaining
        - giant_ancestry_armed
        - large_form_uses_remaining
        - large_form_turns_remaining
        - adrenaline_rush_uses_remaining
        - relentless_endurance_available
        - temporary_hit_points
        - bonus_action_used_round
        - movement_budget_ft
        - movement_effect
        - player_turn_counter
    SkillCheckResult:
      type: object
      additionalProperties: false
      properties:
        skill:
          type: string
          minLength: 1
          maxLength: 40
        ability:
          type: string
          enum: [strength, dexterity, constitution, intelligence, wisdom, charisma]
        d20:
          type: integer
          minimum: 1
          maximum: 20
        d20_rolls:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: integer
            minimum: 1
            maximum: 20
        advantage:
          type: boolean
        disadvantage:
          type: boolean
        proficient:
          type: boolean
        expertise:
          type: boolean
        ability_modifier:
          type: integer
        proficiency_modifier:
          type: integer
          minimum: 0
        total_modifier:
          type: integer
        total:
          type: integer
        difficulty:
          type: string
          enum: [easy, medium, hard, very_hard, extreme]
        dc:
          type: integer
          minimum: 1
          maximum: 30
        outcome:
          type: string
          enum: [success, failure]
        action_id:
          type: string
          format: uuid
        resolution_id:
          type: ["string", "null"]
      required:
        - skill
        - ability
        - d20
        - proficient
        - ability_modifier
        - proficiency_modifier
        - total_modifier
        - total
        - difficulty
        - dc
        - outcome
    CombatAttackResult:
      type: object
      additionalProperties: false
