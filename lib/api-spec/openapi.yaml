    AdventureThread:
      type: object
      properties:
        thread_id: {type: string}
        title: {type: string}
        origin: {type: string, enum: [player, local_proposal, legacy_quest]}
        status:
          type: string
          enum: [discovered, offered, active, progressing, reframed, succeeded, failed, abandoned, expired]
        location_id: {type: string}
        npc_id: {type: [string, "null"]}
        allegiance_id: {type: [string, "null"]}
        deadline: {type: [integer, "null"]}
        objectives:
          type: array
          items:
            type: object
            properties:
              objective_id: {type: string}
              description: {type: string}
