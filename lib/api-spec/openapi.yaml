        pending_event_decisions:
          type: array
          items: {$ref: "#/components/schemas/PendingEventDecision"}
        journey:
          anyOf:
            - $ref: "#/components/schemas/GameJourney"
            - type: "null"
        expedition: {$ref: "#/components/schemas/GameExpedition"}
        location:
          type: string
        scene:
          anyOf:
            - $ref: "#/components/schemas/GameScene"
            - type: "null"
        conversation:
          $ref: "#/components/schemas/GameConversation"
        world:
          $ref: "#/components/schemas/GameWorldMetadata"
        journal:
          $ref: "#/components/schemas/CampaignJournal"
        locations:
