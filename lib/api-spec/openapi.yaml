        target_id:
          type: ["string", "null"]
        target_name:
          type: ["string", "null"]
        weapon:
          type: ["string", "null"]
        attack_roll:
          type: ["integer", "null"]
        attack_bonus:
          type: ["integer", "null"]
        attack_total:
          type: ["integer", "null"]
        target_ac:
          type: ["integer", "null"]
        critical:
          type: ["boolean", "null"]
        damage:
          type: ["integer", "null"]
        target_hp_before:
          type: ["integer", "null"]
        target_hp_after:
          type: ["integer", "null"]
        target_status:
          type: ["string", "null"]
        damage_type:
          type: ["string", "null"]
        attack_rolls:
          type: ["array", "null"]
          items:
            type: integer
            minimum: 1
            maximum: 20
        disadvantage:
          type: ["boolean", "null"]
        hp_damage:
          type: ["integer", "null"]
          minimum: 0
        temporary_hp_before:
          type: ["integer", "null"]
          minimum: 0
        temporary_hp_absorbed:
          type: ["integer", "null"]
          minimum: 0
        temporary_hp_after:
          type: ["integer", "null"]
          minimum: 0
        species_effects:
          type: ["array", "null"]
          items:
            type: object
            additionalProperties: true
        action_id:
          type: ["string", "null"]
          format: uuid
        resolution_id:
          type: ["string", "null"]
        critical_state:
          type: ["string", "null"]
        resolution:
          anyOf:
            - type: object
