      required: [plan_id, goal, status, cursor, location_id, steps]
    CampaignAdventureCard:
      type: object
      additionalProperties: false
      properties:
        title: {type: string}
        summary: {type: string}
        label: {type: string}
        text: {type: string}
        objectives:
          type: array
          items: {type: string}
      required: []
    CampaignAdventureJournal:
      type: object
      additionalProperties: false
      properties:
        rumors:
          type: array
          items: {$ref: "#/components/schemas/CampaignAdventureCard"}
        active:
          type: array
          items: {$ref: "#/components/schemas/CampaignAdventureCard"}
        completed:
          type: array
          items: {$ref: "#/components/schemas/CampaignAdventureCard"}
        failed:
          type: array
          items: {$ref: "#/components/schemas/CampaignAdventureCard"}
        timeline:
          type: array
          items: {type: string}
        affordances:
          type: array
          items: {type: string}
      required: [rumors, active, completed, failed, timeline, affordances]
    GameState:
      type: object
