        routes:
          type: array
          items: {$ref: "#/components/schemas/ExplorationRoute"}
        exits:
          type: array
          items: {$ref: "#/components/schemas/ExplorationExit"}
        obstacles:
          type: array
          items: {$ref: "#/components/schemas/ExplorationObstacle"}
        discoveries:
          type: array
          items: {$ref: "#/components/schemas/ExplorationDiscovery"}
        actions:
          type: array
          items: {$ref: "#/components/schemas/ExplorationAction"}
    ExplorationRoute:
      type: object
      additionalProperties: false
      required: [id, origin, destination, name, distance_miles, duration_seconds, blocked]
      properties:
        id: {type: string}
        origin: {type: string}
        destination: {type: string}
        name: {type: string}
        distance_miles: {type: number, exclusiveMinimum: 0}
        duration_seconds: {type: [integer, "null"], minimum: 1}
