          additionalProperties:
            $ref: "#/components/schemas/GameLocation"
        character:
          $ref: "#/components/schemas/GameCharacter"
        spellcasting:
          description: Optional read-only projection of existing Python spell state; absence/null grants no spell access. This is not a cast-legality decision.
          anyOf:
            - $ref: "#/components/schemas/GameSpellcasting"
            - type: "null"
        inventory:
          type: array
          items:
