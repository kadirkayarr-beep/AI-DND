        kind: {type: string, enum: [promise, conditional, debt]}
        status: {type: string, enum: [open, fulfilled, broken]}
      required: [commitment_id, npc_id, quote, thread_id, kind, status]
    AdventurePlan:
      type: object
      properties:
        plan_id: {type: string}
        goal: {type: string}
        status: {type: string, enum: [awaiting_confirmation, paused, completed, abandoned]}
