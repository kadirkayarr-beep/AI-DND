            - type: "null"
        death_save:
          anyOf:
            - $ref: "#/components/schemas/DeathSaveResult"
            - type: "null"
        death_resolution:
          anyOf:
            - $ref: "#/components/schemas/DeathResolutionResult"
            - type: "null"
    CombatTurnResult:
      type: object
      additionalProperties: false
      properties:
        economy_steps:
          type: ["array", "null"]
          items: {type: object, additionalProperties: true}
        combat_id:
          type: ["string", "null"]
        combat_status:
          type: ["string", "null"]
        round:
          type: ["integer", "null"]
        current_turn_index:
          type: ["integer", "null"]
        action:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        success:
          type: ["boolean", "null"]
        outcome:
          type: ["string", "null"]
        actor:
          type: ["string", "null"]
        actor_name:
          type: ["string", "null"]
        target:
          type: ["string", "null"]
        target_id:
          type: ["string", "null"]
        target_name:
          type: ["string", "null"]
        weapon:
          type: ["string", "null"]
        attack_roll:
          type: ["integer", "null"]
        attack_bonus:
          type: ["integer", "null"]
        attack_total:
          type: ["integer", "null"]
        target_ac:
          type: ["integer", "null"]
        critical:
          type: ["boolean", "null"]
        damage:
          type: ["integer", "null"]
        target_hp_before:
          type: ["integer", "null"]
        target_hp_after:
          type: ["integer", "null"]
        target_status:
          type: ["string", "null"]
        damage_type:
          type: ["string", "null"]
        attack_rolls:
          type: ["array", "null"]
          items:
            type: integer
