openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: game
    description: Direct AI-DND game-session operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /game/health:
    get:
      operationId: getGameHealth
      tags: [game]
      summary: Check the AI-DND service
      responses:
        "200":
          description: AI-DND service health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameHealth"
  /game/sessions:
    post:
      operationId: createGameSession
      tags: [game]
      summary: Create a new isolated game session
      responses:
        "200":
          description: New game session and its public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameSession"
  /game/sessions/{session_id}/state:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
    get:
      operationId: getGameSessionState
      tags: [game]
      summary: Read the canonical public state for a game session
      responses:
        "200":
          description: Current public game state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameState"
  /game/sessions/{session_id}/turn:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
    post:
      operationId: playGameTurn
      tags: [game]
      summary: Submit one player message to the Python game engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GameTurnInput"
      responses:
        "200":
          description: Engine-confirmed narration and updated public state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GameTurnResult"
  /game/character-options:
    get:
      operationId: getCharacterOptions
      tags: [game]
      summary: Read race and class choices supported by the Python engine
      responses:
        "200":
          description: Canonical character creation options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterCreationOptions"
  /game/campaigns:
    get:
      operationId: getCampaigns
      tags: [game]
      summary: List safe campaign metadata
      responses:
        "200":
          description: Persistent campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignSummary"
    post:
      operationId: createCampaign
      tags: [game]
      summary: Create a campaign with an initial server-owned save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignCreateInput"
      responses:
        "200":
          description: Campaign, live session, and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
  /game/campaigns/{campaign_id}:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCampaign
      tags: [game]
      summary: Read safe metadata, canonical UI state, and saved history
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDetail"
  /game/campaigns/{campaign_id}/resume:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: resumeCampaign
      tags: [game]
      summary: Restore a campaign into a current runtime session
      responses:
        "200":
          description: Resumed campaign and canonical state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSession"
  /game/campaigns/{campaign_id}/save:
    parameters:
      - in: path
        name: campaign_id
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: saveCampaign
      tags: [game]
      summary: Save the current server-side campaign session
      responses:
        "200":
          description: Updated safe campaign metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GameHealth:
      type: object
      properties:
        status:
          type: string
        engine:
          type: string
        model:
          type: string
      required: [status, engine, model]
    GameSession:
      type: object
      properties:
        session_id:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
      required: [session_id, state]
    GameTurnInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
      required: [message]
    GameTurnResult:
      type: object
      properties:
        session_id:
          type: string
        narration:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
        combat_result:
          anyOf:
            - $ref: "#/components/schemas/CombatTurnResult"
            - type: "null"
          description: Structured combat outcome returned by Python; null for non-combat turns.
      required: [session_id, narration, state, combat_result]
    CombatAttackResult:
      type: object
      additionalProperties: false
      properties:
        action:
          type: string
        status:
          type: string
        success:
          type: boolean
        outcome:
          type: string
        actor:
          type: string
        target:
          type: string
        target_id:
          type: string
        target_name:
          type: string
        weapon:
          type: string
        attack_roll:
          type: integer
        attack_bonus:
          type: integer
        attack_total:
          type: integer
        target_ac:
          type: integer
        critical:
          type: boolean
        damage:
          type: integer
        target_hp_before:
          type: integer
        target_hp_after:
          type: integer
        target_status:
          type: string
    CombatTurnResult:
      allOf:
        - $ref: "#/components/schemas/CombatAttackResult"
        - type: object
          additionalProperties: false
          properties:
            combat_started:
              type: boolean
            combat_ended:
              type: boolean
            end_reason:
              type: string
            enemy_action:
              anyOf:
                - $ref: "#/components/schemas/CombatAttackResult"
                - type: "null"
    GameState:
      type: object
      properties:
        location:
          type: string
        world:
          $ref: "#/components/schemas/GameWorldMetadata"
        journal:
          $ref: "#/components/schemas/CampaignJournal"
        locations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/GameLocation"
        character:
          $ref: "#/components/schemas/GameCharacter"
        inventory:
          type: array
          items:
            type: string
        npcs:
          type: array
          items:
            $ref: "#/components/schemas/GameNpc"
        features:
          type: array
          items:
            $ref: "#/components/schemas/GameFeature"
        doors:
          type: array
          items:
            $ref: "#/components/schemas/GameDoor"
        combat:
          $ref: "#/components/schemas/GameCombat"
        player_combat_status:
          type: ["string", "null"]
        turn_index:
          type: integer
      required:
        - location
        - world
        - journal
        - locations
        - character
        - inventory
        - npcs
        - features
        - doors
        - combat
        - player_combat_status
        - turn_index
    CampaignJournal:
      type: object
      description: Python-owned discoveries, encounters, deterministic events, and canonical quest ledger.
      properties:
        schema_version:
          type: integer
          enum: [1]
        discovered_locations:
          type: array
          items:
            $ref: "#/components/schemas/JournalLocation"
        known_npcs:
          type: array
          items:
            $ref: "#/components/schemas/JournalNpc"
        notable_events:
          type: array
          items:
            $ref: "#/components/schemas/JournalEvent"
        quests:
          type: array
          items:
            $ref: "#/components/schemas/CampaignQuest"
      required:
        - schema_version
        - discovered_locations
        - known_npcs
        - notable_events
        - quests
    JournalLocation:
      type: object
      properties:
        location_id:
          type: string
        name:
          type: string
        environment:
          type: string
          enum: [tavern, forest, city, village, road, wilderness, dungeon, cave, castle, temple, ruins, unknown]
        first_discovered_at:
          type: string
          format: date-time
        last_visited_at:
          type: string
          format: date-time
        first_discovered_turn:
          type: integer
          minimum: 0
        last_visited_turn:
          type: integer
          minimum: 0
        visit_count:
          type: integer
          minimum: 1
      required:
        - location_id
        - name
        - environment
        - first_discovered_at
        - last_visited_at
        - first_discovered_turn
        - last_visited_turn
        - visit_count
    JournalNpc:
      type: object
      properties:
        npc_id:
          type: string
        name:
          type: string
        role:
          type: ["string", "null"]
        first_met_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        first_met_turn:
          type: integer
          minimum: 0
        last_seen_turn:
          type: integer
          minimum: 0
        last_known_location_id:
          type: ["string", "null"]
        last_known_location:
          type: ["string", "null"]
      required:
        - npc_id
        - name
        - role
        - first_met_at
        - last_seen_at
        - first_met_turn
        - last_seen_turn
        - last_known_location_id
        - last_known_location
    JournalEvent:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
        event_type:
          type: string
          enum:
            - location_discovered
            - npc_met
            - combat_started
            - combat_ended
            - enemy_defeated
            - player_unconscious
            - item_gained
            - item_lost
        created_at:
          type: string
          format: date-time
        turn_index:
          type: integer
          minimum: 0
        summary:
          type: string
        location_id:
          type: ["string", "null"]
        location_name:
          type: ["string", "null"]
        related_npc_id:
          type: ["string", "null"]
        related_item:
          type: ["string", "null"]
      required:
        - event_id
        - event_type
        - created_at
        - turn_index
        - summary
        - location_id
        - location_name
        - related_npc_id
        - related_item
    CampaignQuest:
      type: object
      properties:
        quest_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [active, completed, failed, cancelled]
        giver_npc_id:
          type: ["string", "null"]
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/CampaignQuestObjective"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: ["string", "null"]
          format: date-time
      required:
        - quest_id
        - title
        - description
        - status
        - giver_npc_id
        - objectives
        - created_at
        - updated_at
        - completed_at
    CampaignQuestObjective:
      type: object
      properties:
        objective_id:
          type: string
          format: uuid
        description:
          type: string
        status:
          type: string
          enum: [active, completed, failed, cancelled]
      required:
        - objective_id
        - description
        - status
    GameWorldMetadata:
      type: object
      description: Python-owned atmosphere metadata; never supplied by the browser.
      properties:
        environment:
          type: string
          enum:
            - tavern
            - forest
            - city
            - village
            - road
            - wilderness
            - dungeon
            - cave
            - castle
            - temple
            - ruins
            - unknown
        time_of_day:
          type: string
          enum: [dawn, day, evening, night]
        weather:
          type: string
          enum: [clear, rain, fog, snow, storm, unknown]
      required: [environment, time_of_day, weather]
    GameLocation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        description:
          type: string
      required: [id, name, type, description]
    GameCharacter:
      type: object
      properties:
        name:
          type: string
        race:
          type: string
        class:
          type: string
        strength:
          type: integer
        dexterity:
          type: integer
        constitution:
          type: integer
        intelligence:
          type: integer
        wisdom:
          type: integer
        charisma:
          type: integer
        proficient_skills:
          type: array
          items:
            type: string
        level:
          type: integer
        proficiency_bonus:
          type: integer
        max_hp:
          type: integer
        current_hp:
          type: integer
        armor_class:
          type: integer
      required:
        - name
        - race
        - class
        - strength
        - dexterity
        - constitution
        - intelligence
        - wisdom
        - charisma
        - proficient_skills
        - level
        - proficiency_bonus
        - max_hp
        - current_hp
        - armor_class
    GameNpc:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        location:
          type: string
        appearance:
          type: ["string", "null"]
        relationship:
          type: ["string", "null"]
        max_hp:
          type: ["integer", "null"]
        current_hp:
          type: ["integer", "null"]
        armor_class:
          type: ["integer", "null"]
        combat_status:
          type: ["string", "null"]
      required:
        - id
        - name
        - role
        - location
        - appearance
        - relationship
        - max_hp
        - current_hp
        - armor_class
        - combat_status
    GameFeature:
      type: object
      properties:
        location:
          type: string
        name:
          type: string
        description:
          type: string
      required: [location, name, description]
    GameDoor:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        location:
          type: string
        description:
          type: string
        open:
          type: boolean
        locked:
          type: boolean
        broken:
          type: boolean
      required: [id, name, location, description, open, locked, broken]
    GameCombat:
      type: object
      properties:
        active:
          type: boolean
        round:
          type: integer
        initiative_order:
          type: array
          items:
            type: string
        current_turn_index:
          type: integer
        participants:
          type: array
          items:
            type: object
            additionalProperties: true
        target_id:
          type: ["string", "null"]
      additionalProperties: true
    CampaignCreateInput:
      type: object
      properties:
        name:
          type: ["string", "null"]
          minLength: 1
          maxLength: 100
        character:
          oneOf:
            - $ref: "#/components/schemas/CharacterCreateInput"
            - type: "null"
      additionalProperties: false
    CharacterCreateInput:
      type: object
      properties:
        mode:
          type: string
          enum: [custom, random]
        name:
          type: string
          minLength: 1
          maxLength: 40
        race:
          type: string
        class:
          type: string
      required: [mode]
      additionalProperties: false
    CharacterCreationOptions:
      type: object
      properties:
        races:
          type: array
          items:
            type: string
        classes:
          type: array
          items:
            type: string
      required: [races, classes]
    CampaignSummary:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_played_at:
          type: string
          format: date-time
        save_version:
          type: integer
        character_name:
          type: string
        character_race:
          type: string
        character_class:
          type: string
        character_level:
          type: integer
        location:
          type: string
      required:
        - campaign_id
        - name
        - created_at
        - updated_at
        - last_played_at
        - save_version
        - character_name
        - character_race
        - character_class
        - character_level
        - location
    CampaignHistoryEntry:
      type: object
      properties:
        player_message:
          type: string
        narration:
          type: string
        created_at:
          type: string
          format: date-time
      required: [player_message, narration, created_at]
    CampaignDetail:
      type: object
      properties:
        campaign:
          $ref: "#/components/schemas/CampaignSummary"
        state:
          $ref: "#/components/schemas/GameState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/CampaignHistoryEntry"
      required: [campaign, state, history]
    CampaignSession:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        name:
          type: string
        state:
          $ref: "#/components/schemas/GameState"
        history:
          type: array
          items:
            $ref: "#/components/schemas/CampaignHistoryEntry"
      required: [campaign_id, session_id, name, state, history]

