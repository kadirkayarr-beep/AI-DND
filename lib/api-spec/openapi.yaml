      properties:
        environment:
          type: string
          default: unknown
          enum:
            - tavern
            - forest
            - city
            - village
            - road
            - wilderness
            - dungeon
            - cave
            - castle
            - temple
            - ruins
            - unknown
        time_of_day:
          type: string
          enum: [dawn, day, evening, night]
          default: day
        weather:
          type: string
          enum: [clear, rain, fog, snow, storm, unknown]
          default: clear
      required: [environment, time_of_day, weather]
