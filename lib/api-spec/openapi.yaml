openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: AI-DND API contract. Prefer the /game/... route family for new clients.
    The matching /... paths are retained as legacy compatibility aliases.
servers:
- url: /api
  description: Base API path
tags:
- name: health
  description: Health operations
- name: game
  description: Direct AI-DND game-session operations
paths:
  /game/sessions/{session_id}/level-up:
    get:
      summary: Preview Earned Level Up
      operationId: getGameSessionLevelUp
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelUpPreviewResponse'
      tags:
      - game
    post:
      summary: Apply Earned Level Up
      operationId: applyGameSessionLevelUp
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelUpApplyRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelUpCommandResult'
      tags:
      - game
  /game/health:
    get:
      operationId: getGameHealth
      tags:
      - game
      summary: Check the AI-DND service
      responses:
        '200':
          description: AI-DND service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /game/sessions:
    post:
      operationId: createGameSession
      tags:
      - game
      summary: Create a new isolated game session
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: New game session and its public state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameSession'
  /game/sessions/{session_id}/state:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getGameSessionState
      tags:
      - game
      summary: Read the canonical public state for a game session
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Current public game state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameState'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
  /game/sessions/{session_id}/species-actions:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resolveSpeciesTraitAction
      tags:
      - game
      summary: Resolve one server-authoritative species trait action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesTraitActionInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Server-rolled effect and updated canonical character state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesTraitCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /sessions/{session_id}/species-actions:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resolveSpeciesTraitActionCompat
      tags:
      - game
      summary: Legacy server-authoritative species action alias
      description: Compatibility alias for /game/sessions/{session_id}/species-actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeciesTraitActionInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Server-rolled effect and updated canonical character state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SpeciesTraitCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/turn:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: playGameTurn
      tags:
      - game
      summary: Submit one player message to the Python game engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameTurnInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Engine-confirmed narration and updated public state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameTurnResult'
        '409':
          $ref: '#/components/responses/ApiError'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/actions/unresolved:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getUnresolvedGameAction
      tags:
      - game
      summary: Read the one accepted-but-unfinished action of this campaign, if any
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: The open action of the campaign, or null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnresolvedGameAction'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/actions/{action_id}:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: action_id
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getGameActionStatus
      tags:
      - game
      summary: Read what the server recorded for one action id
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: applied, not_applied, open or unknown; unknown and open are
            never evidence that nothing happened
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameActionStatus'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/actions/{action_id}/abandon:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: action_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: abandonGameAction
      tags:
      - game
      summary: Close an action id for good (server-proven) or learn it is applied
        or still processing
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: applied (nothing is closed), not_applied (durably refused;
            a late request can never apply) or processing (identity kept)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameActionStatus'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/undo:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: undoGameTurn
      tags:
      - game
      summary: Undo the last completed turn and its effects (one step)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameTurnUndoInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: The last completed turn was undone; restored public state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GameTurnUndoResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/quests/{quest_id}/accept:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: quest_id
      required: true
      schema:
        type: string
        maxLength: 120
    post:
      operationId: acceptGameQuest
      tags:
      - game
      summary: Explicitly accept a server-owned quest offer
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Canonical quest state and transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/quests/{quest_id}/cancel:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: quest_id
      required: true
      schema:
        type: string
        maxLength: 120
    post:
      operationId: cancelGameQuest
      tags:
      - game
      summary: Explicitly cancel an accepted quest
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Canonical quest state and transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/sessions/{session_id}/ambient-events/{event_instance_id}/actions:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: event_instance_id
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 96
    post:
      operationId: resolveAmbientEventAction
      tags:
      - game
      summary: Resolve one validated action against an active ambient event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmbientEventActionInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Engine-confirmed event result and persisted campaign state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmbientEventCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /sessions/{session_id}/quests/{quest_id}/accept:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: quest_id
      required: true
      schema:
        type: string
        maxLength: 120
    post:
      operationId: acceptLegacyQuest
      tags:
      - game
      summary: Legacy quest accept alias
      description: Compatibility alias for /game/sessions/{session_id}/quests/{quest_id}/accept.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Canonical quest state and transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /sessions/{session_id}/quests/{quest_id}/cancel:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: quest_id
      required: true
      schema:
        type: string
        maxLength: 120
    post:
      operationId: cancelLegacyQuest
      tags:
      - game
      summary: Legacy quest cancel alias
      description: Compatibility alias for /game/sessions/{session_id}/quests/{quest_id}/cancel.
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Canonical quest state and transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /sessions/{session_id}/ambient-events/{event_instance_id}/actions:
    parameters:
    - in: path
      name: session_id
      required: true
      schema:
        type: string
        format: uuid
    - in: path
      name: event_instance_id
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 96
    post:
      operationId: resolveAmbientEventActionCompat
      tags:
      - game
      summary: Legacy ambient event action alias
      description: Compatibility alias for /game/sessions/{session_id}/ambient-events/{event_instance_id}/actions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AmbientEventActionInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Engine-confirmed event result and persisted campaign state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AmbientEventCommandResult'
        '404':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
  /game/logout:
    post:
      operationId: logoutGame
      tags:
      - game
      summary: Clear the HttpOnly session cookie
      responses:
        '204':
          description: Session cookie cleared
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /logout:
    post:
      operationId: logoutLegacy
      tags:
      - game
      summary: Legacy session cookie logout alias
      responses:
        '204':
          description: Session cookie cleared
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /game/campaign-start-options:
    get:
      operationId: getCampaignStartOptions
      tags:
      - game
      summary: List campaign starts from installed verified setting packs
      responses:
        '200':
          description: Verified campaign start options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStartOptionsResponse'
  /game/character-options:
    get:
      operationId: getCharacterOptions
      tags:
      - game
      summary: Read race and class choices supported by the Python engine
      responses:
        '200':
          description: Canonical character creation options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreationOptions'
  /game/character-creation-catalog:
    get:
      operationId: getCharacterCreationCatalog
      tags:
      - game
      summary: Read D&D 2024 rules character creation options catalog
      responses:
        '200':
          description: Canonical character creation catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreationCatalogResponse'
  /game/character-identity-suggestions:
    post:
      operationId: createCharacterIdentitySuggestion
      tags:
      - game
      summary: Ask for one bounded character-identity draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySuggestionRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: The same suggestion job for this request id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySuggestionJob'
        '422':
          $ref: '#/components/responses/RequestValidationError'
  /game/character-identity-suggestions/{request_id}:
    parameters:
    - in: path
      name: request_id
      required: true
      schema:
        type: string
        maxLength: 80
    get:
      operationId: getCharacterIdentitySuggestion
      tags:
      - game
      summary: Read one character-identity suggestion job
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Current suggestion job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySuggestionJob'
        '404':
          $ref: '#/components/responses/ApiError'
  /game/campaigns:
    get:
      operationId: getCampaigns
      tags:
      - game
      summary: List safe campaign metadata
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Persistent campaigns
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CampaignSummary'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
    post:
      operationId: createCampaign
      tags:
      - game
      summary: Create a campaign with an initial server-owned save
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateInput'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Campaign, live session, and canonical state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSession'
        '422':
          $ref: '#/components/responses/CampaignCreateValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/campaigns/{campaign_id}:
    parameters:
    - in: path
      name: campaign_id
      required: true
      schema:
        type: string
        format: uuid
    delete:
      operationId: deleteCampaign
      tags:
      - game
      summary: Permanently delete a selected campaign and revoke its active session
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Campaign is absent after the atomic deletion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDeleteResult'
        '503':
          $ref: '#/components/responses/ApiError'
    get:
      operationId: getCampaign
      tags:
      - game
      summary: Read safe metadata, canonical UI state, and saved history
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetail'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/campaigns/{campaign_id}/resume:
    parameters:
    - in: path
      name: campaign_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: resumeCampaign
      tags:
      - game
      summary: Restore a campaign into a current runtime session
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Resumed campaign and canonical state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSession'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /game/campaigns/{campaign_id}/save:
    parameters:
    - in: path
      name: campaign_id
      required: true
      schema:
        type: string
        format: uuid
    post:
      operationId: saveCampaign
      tags:
      - game
      summary: Save the current server-side campaign session
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: Updated safe campaign metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignSummary'
        '404':
          $ref: '#/components/responses/ApiError'
        '409':
          $ref: '#/components/responses/ApiError'
        '422':
          $ref: '#/components/responses/RequestValidationError'
        '500':
          $ref: '#/components/responses/ApiError'
        '503':
          $ref: '#/components/responses/ApiError'
  /health:
    get:
      operationId: getLegacyHealth
      tags:
      - game
      summary: Legacy health alias
      description: Compatibility alias for /game/health. Prefer the /game route family
        for new clients.
      responses:
        '200':
          description: AI-DND service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /campaign-start-options:
    get:
      operationId: getLegacyCampaignStartOptions
      tags:
      - game
      summary: Legacy campaign-start-options alias
      description: Compatibility alias for /game/campaign-start-options. Prefer the
        /game route family for new clients.
      responses:
        '200':
          description: Verified campaign start options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignStartOptionsResponse'
  /character-options:
    get:
      operationId: getLegacyCharacterOptions
      tags:
      - game
      summary: Legacy character-options alias
      description: Compatibility alias for /game/character-options. Prefer the /game
        route family for new clients.
      responses:
        '200':
          description: Canonical character creation options
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreationOptions'
  /character-creation-catalog:
    get:
      operationId: getLegacyCharacterCreationCatalog
      tags:
      - game
      summary: Legacy character-creation-catalog alias
      description: Compatibility alias for /game/character-creation-catalog. Prefer
        the /game route family for new clients.
      responses:
        '200':
          description: Canonical character creation catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CharacterCreationCatalogResponse'
  /character-identity-suggestions:
    post:
      operationId: createLegacyCharacterIdentitySuggestion
      tags:
      - game
      summary: Legacy character-identity suggestion alias
      description: Compatibility alias for /game/character-identity-suggestions. Prefer
        the /game route family for new clients.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdentitySuggestionRequest'
      responses:
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '200':
          description: The same suggestion job for this request id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdentitySuggestionJob'
        '422':
