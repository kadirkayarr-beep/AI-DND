        Custom mode requires non-null name, race, and class. Human and Half-Elf
        clients provide their species bonus skills separately from class skills.
        Random mode rejects non-null custom fields; omitted or explicit null
        custom fields are allowed.
      properties:
        mode:
          type: string
          enum: [custom, random]
        name:
          type: ["string", "null"]
          minLength: 1
          maxLength: 40
        race:
          type: ["string", "null"]
        class:
          type: ["string", "null"]
        species:
          type: ["string", "null"]
        giant_ancestry:
          type: ["string", "null"]
          enum: [cloud, fire, frost, hill, stone, storm, null]
        background:
          type: ["string", "null"]
        alignment:
          type: ["string", "null"]
        ability_score_method:
          type: ["string", "null"]
        ability_scores:
          type: ["object", "null"]
        background_ability_bonuses:
          type: ["object", "null"]
        proficient_skills:
          type: ["array", "null"]
          items:
            type: string
        proficient_tools:
          type: ["array", "null"]
          items:
            type: string
        origin_feat:
          type: ["string", "null"]
        species_bonus_feat:
          type: ["string", "null"]
        species_bonus_skills:
          type: ["array", "null"]
          items:
            type: string
        fighting_style:
          type: ["string", "null"]
        equipment_package:
          type: ["string", "null"]
        equipment_choices:
          type: ["array", "null"]
          items:
            type: string
        cantrips:
          type: ["array", "null"]
          items:
            type: string
        spells:
          type: ["array", "null"]
          items:
            type: string
        languages:
          type: ["array", "null"]
          items:
            type: string
        background_equipment_option:
          type: ["string", "null"]
          enum: ["A", "B", null]
        origin:
          type: ["string", "null"]
          maxLength: 240
        appearance:
          type: ["string", "null"]
          maxLength: 1000
        personality:
          type: ["string", "null"]
          maxLength: 1000
        backstory:
          type: ["string", "null"]
          maxLength: 2000
      required: [mode]
      additionalProperties: false
    CharacterCreationOptions:
      type: object
      additionalProperties: false
      properties:
        races:
          type: array
          items:
            type: string
        classes:
