            type: integer
            minimum: 0
        slot_turn:
          description: Existing marker [combat_id, round, turn_index], or null; not evidence that a cast is currently legal.
          anyOf:
            - type: array
              minItems: 3
              maxItems: 3
              items:
                anyOf:
