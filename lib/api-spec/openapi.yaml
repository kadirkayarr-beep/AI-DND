      properties:
        year: {type: integer}
        month: {type: string}
        day: {type: integer}
        hour: {type: integer, minimum: 0, maximum: 23}
        minute: {type: integer, minimum: 0, maximum: 59}
        second: {type: integer, minimum: 0, maximum: 59}
        day_index: {type: integer, minimum: 0}
        calendar: {type: string, enum: [Harptos]}
        local_convention: {type: string}
        time_of_day: {type: string, enum: [dawn, day, evening, night]}
        display: {type: string}
        detail: {type: string}
    KnownScheduledEvent:
      type: object
      additionalProperties: false
      required: [summary, window_start, window_end, status]
      properties:
        summary: {type: string}
        window_start: {type: integer}
        window_end: {type: integer}
        status: {type: string, enum: [PENDING, OCCURRED, EXPIRED]}
    GameJourney:
      type: object
      additionalProperties: false
      required: [destination, status, stage, stage_count, encounter]
      properties:
        current_stage: {$ref: "#/components/schemas/GameJourneyStage"}
        origin: {type: string}
        pace: {type: string, enum: [fast, normal, slow]}
        distance_miles: {type: number, minimum: 0}
        duration_seconds: {type: integer, minimum: 1}
        remaining_seconds: {type: integer, minimum: 0}
        destination: {type: string}
        status: {type: string, enum: [TRAVELLING, INTERRUPTED, STOPPED, ARRIVED]}
