    RequestValidationError:
      description: Request fields or path parameters failed FastAPI validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RequestValidationError"
    CampaignCreateValidationError:
      description: Request validation failed or the requested character was invalid.
      content:
        application/json:
          schema:
            anyOf:
