        npcs:
          type: array
          items:
            $ref: "#/components/schemas/GameNpc"
        shops:
          type: array
          items:
            $ref: "#/components/schemas/GameShop"
        features:
          type: array
          items:
            $ref: "#/components/schemas/GameFeature"
        doors:
          type: array
          items:
            $ref: "#/components/schemas/GameDoor"
        combat:
          $ref: "#/components/schemas/GameCombat"
        death_state:
