        - journey
        - location
        - scene
        - conversation
        - world
        - journal
        - locations
        - character
        - inventory
        - npcs
        - shops
        - features
        - doors
        - combat
        - death_state
        - player_combat_status
        - turn_index
        - quests
        - quest_offers
        - campaign_adventures
        - known_lore
        - known_factions
    SceneIncident:
      type: object
